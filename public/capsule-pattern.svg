<svg xmlns="http://www.w3.org/2000/svg" width="84" height="64" viewBox="0 0 84 64">
  <defs>
    <g id="capsule">
      <rect x="-16" y="-7" width="32" height="14" rx="7" ry="7" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
      <line x1="0" y1="-7" x2="0" y2="7" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    </g>
  </defs>
  <!-- Center capsule -->
  <use href="#capsule" transform="translate(42, 32) rotate(-35)" />
  <!-- Corner capsules for seamless tiling -->
  <use href="#capsule" transform="translate(0, 0) rotate(-35)" />
  <use href="#capsule" transform="translate(84, 0) rotate(-35)" />
  <use href="#capsule" transform="translate(0, 64) rotate(-35)" />
  <use href="#capsule" transform="translate(84, 64) rotate(-35)" />
</svg>
